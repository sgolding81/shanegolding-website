<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Discord assistant bridge workflow</title>
  <desc id="desc">Discord requests enter a TypeScript bridge, move through a queue and approval step, then return as thread, reminder, voice, and activity outputs.</desc>
  <rect width="960" height="600" rx="28" fill="#111113"/>
  <g fill="#1b1b1e" stroke-width="4">
    <rect x="60" y="196" width="190" height="208" rx="18" stroke="#7f9cf5"/>
    <rect x="335" y="158" width="290" height="284" rx="18" stroke="#d8a574"/>
    <rect x="710" y="84" width="190" height="100" rx="16" stroke="#68686c"/>
    <rect x="710" y="208" width="190" height="100" rx="16" stroke="#68686c"/>
    <rect x="710" y="332" width="190" height="100" rx="16" stroke="#68686c"/>
    <rect x="710" y="456" width="190" height="76" rx="16" stroke="#68686c"/>
  </g>
  <g fill="#f1f1f2" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="155" y="278" font-size="31" font-weight="700">Discord</text><text x="155" y="320" font-size="20" fill="#aaaab0">request</text>
    <text x="480" y="226" font-size="30" font-weight="700">TypeScript bridge</text>
    <rect x="384" y="268" width="192" height="50" rx="10" fill="#26262a"/><text x="480" y="300" font-size="19">Queued requests</text>
    <rect x="384" y="338" width="192" height="50" rx="10" fill="#26262a"/><text x="480" y="370" font-size="19">Human approval</text>
    <text x="805" y="144" font-size="21" font-weight="700">Threads</text>
    <text x="805" y="268" font-size="21" font-weight="700">Reminders</text>
    <text x="805" y="392" font-size="21" font-weight="700">Voice replies</text>
    <text x="805" y="503" font-size="19" font-weight="700">Activity record</text>
  </g>
  <g fill="#d8a574"><path d="m306 300-30-18v36z"/><path d="m681 300-30-18v36z"/></g>
  <path d="M680 134v360" stroke="#68686c" stroke-width="4"/>
</svg>
